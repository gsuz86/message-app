<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    h2 { margin-bottom: 4px; }
    #current-user { font-size: 0.85rem; color: #666; }
    #change-name { font-size: 0.8rem; background: none; border: none; color: #888; cursor: pointer; text-decoration: underline; padding: 0; margin-bottom: 10px; display: block; }

    #layout { display: flex; gap: 12px; }

    /* Sidebar: online users */
    #sidebar { width: 130px; flex-shrink: 0; }
    #sidebar h4 { margin: 0 0 6px; font-size: 0.85rem; color: #555; }
    #user-list { list-style: none; padding: 0; margin: 0; }
    #user-list li {
      padding: 5px 8px; border-radius: 4px; cursor: pointer;
      font-size: 0.9rem; margin-bottom: 3px;
    }
    #user-list li:hover { background: #e8f0fe; }
    #user-list li.selected { background: #d0e4ff; font-weight: bold; }
    #user-list li.self { color: #aaa; cursor: default; font-style: italic; }

    /* Chat area */
    #chat { flex: 1; display: flex; flex-direction: column; }
    #dm-banner {
      font-size: 0.85rem; background: #fff3cd; border: 1px solid #ffc107;
      padding: 4px 8px; border-radius: 4px; margin-bottom: 6px;
      display: none; align-items: center; justify-content: space-between;
    }
    #dm-banner button { font-size: 0.75rem; background: none; border: none; cursor: pointer; color: #888; }
    #messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 8px; margin-bottom: 8px; flex: 1; }
    #messages div { margin: 4px 0; font-size: 0.9rem; }
    .meta { font-weight: bold; }
    .dm-msg { color: #6a0dad; font-style: italic; }
    #input-row { display: flex; gap: 6px; }
    #text { flex: 1; padding: 6px; }
    button#send { padding: 6px 12px; cursor: pointer; }

    /* Name picker overlay */
    #picker-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
    }
    #picker-box {
      background: white; padding: 2rem; border-radius: 8px;
      min-width: 260px; text-align: center;
    }
    #picker-box h3 { margin-top: 0; }
    #name-list { list-style: none; padding: 0; margin: 1rem 0; }
    #name-list li {
      padding: 8px 12px; margin: 4px 0;
      border: 1px solid #ccc; border-radius: 4px; cursor: pointer;
    }
    #name-list li:hover { background: #f0f0f0; }
  </style>
</head>
<body>
  <h2>Simple Chat</h2>

  <div id="picker-overlay">
    <div id="picker-box">
      <h3>Pick your name</h3>
      <ul id="name-list"></ul>
    </div>
  </div>

  <div id="current-user"></div>
  <button id="change-name">change name</button>

  <div id="layout">
    <div id="sidebar">
      <h4>Online</h4>
      <ul id="user-list"></ul>
    </div>
    <div id="chat">
      <div id="dm-banner">
        <span id="dm-label"></span>
        <button id="clear-dm">✕ back to group</button>
      </div>
      <div id="messages"></div>
      <div id="input-row">
        <input id="text" placeholder="Type a message..." />
        <button id="send">Send</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const NAMES = [
      "Sandra", "Jesus", "Bertie", "Bogdi", "Other"
    ];

    const socket = io();
    const messages = document.getElementById("messages");
    const text = document.getElementById("text");
    const overlay = document.getElementById("picker-overlay");
    const nameList = document.getElementById("name-list");
    const currentUserEl = document.getElementById("current-user");
    const userListEl = document.getElementById("user-list");
    const dmBanner = document.getElementById("dm-banner");
    const dmLabel = document.getElementById("dm-label");

    let username = localStorage.getItem("chat-username");
    let dmTarget = null; // null = group chat, string = DM recipient

    // --- Name picker ---

    function showPicker() {
      nameList.innerHTML = "";
      NAMES.forEach(name => {
        const li = document.createElement("li");
        li.textContent = name;
        li.onclick = () => chooseName(name);
        nameList.appendChild(li);
      });
      overlay.style.display = "flex";
    }

    function chooseName(name) {
      username = name;
      localStorage.setItem("chat-username", name);
      overlay.style.display = "none";
      currentUserEl.textContent = `You are: ${name}`;
      // Tell the server who we are so it can map our socket id.
      socket.emit("register", { user: name });
    }

    // --- Online users sidebar ---

    function renderUsers(users) {
      userListEl.innerHTML = "";
      users.forEach(name => {
        const li = document.createElement("li");
        li.textContent = name;
        if (name === username) {
          li.classList.add("self");
          li.title = "you";
        } else {
          if (name === dmTarget) li.classList.add("selected");
          li.onclick = () => selectDmTarget(name);
        }
        userListEl.appendChild(li);
      });
    }

    function selectDmTarget(name) {
      dmTarget = name;
      dmLabel.textContent = `DM → ${name}`;
      dmBanner.style.display = "flex";
      renderUsers(Array.from(userListEl.children).map(li => li.textContent));
      text.placeholder = `Message ${name} privately...`;
      text.focus();
    }

    document.getElementById("clear-dm").onclick = () => {
      dmTarget = null;
      dmBanner.style.display = "none";
      text.placeholder = "Type a message...";
      // Re-render to clear selected state.
      renderUsers(Array.from(userListEl.children).map(li => li.textContent));
    };

    // --- Messages ---

    function addMessage(msg) {
      const div = document.createElement("div");
      div.innerHTML = `<span class="meta">${msg.user}:</span> ${msg.text}`;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function addDm(msg) {
      const div = document.createElement("div");
      const direction = msg.from === username ? `you → ${msg.to}` : `${msg.from} → you`;
      div.innerHTML = `<span class="meta dm-msg">[DM ${direction}]:</span> ${msg.text}`;
      div.classList.add("dm-msg");
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    socket.on("history", (msgs) => msgs.forEach(addMessage));
    socket.on("message", addMessage);
    socket.on("users", renderUsers);
    socket.on("dm", addDm);

    // --- Send ---

    function send() {
      const value = text.value.trim();
      if (!value || !username) return;
      if (dmTarget) {
        socket.emit("dm", { from: username, to: dmTarget, text: value });
      } else {
        socket.emit("message", { user: username, text: value });
      }
      text.value = "";
    }

    document.getElementById("send").onclick = send;
    document.getElementById("change-name").onclick = showPicker;
    text.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

    // --- Init ---

    if (username) {
      overlay.style.display = "none";
      currentUserEl.textContent = `You are: ${username}`;
      socket.emit("register", { user: username });
    } else {
      showPicker();
    }
  </script>
</body>
</html>
