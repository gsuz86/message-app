<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 2rem auto; }
    #messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 8px; }
    #messages div { margin: 4px 0; }
    input { padding: 6px; }
    #text { width: 70%; }
  </style>
</head>
<body>
  <h2>Simple Chat</h2>
  <label>Your name: <input id="name" value="anon" /></label>
  <div id="messages"></div>
  <input id="text" placeholder="Type a message..." />
  <button id="send">Send</button>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const socket = io();
    const messages = document.getElementById("messages");
    const text = document.getElementById("text");
    const name = document.getElementById("name");

    socket.on("message", (msg) => {
      const div = document.createElement("div");
      div.textContent = `${msg.user}: ${msg.text}`;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    });

    function send() {
      const value = text.value.trim();
      if (!value) return;
      socket.emit("message", { user: name.value || "anon", text: value });
      text.value = "";
    }

    document.getElementById("send").onclick = send;
    text.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  </script>
</body>
</html>
